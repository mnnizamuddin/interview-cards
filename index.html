<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Daily interview practice for React, TypeScript, JavaScript and Node developers." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Interview" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Interview Cards</title>
    <script>
      // Sets the theme before the first paint, so the page never flashes the wrong colours.
      // The saved choice wins, else the system setting. Same key as src/ui/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('interview-cards-theme');
        } catch (error) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
      // Sets the page language before the first paint with the rule of src/i18n/language.ts:
      // the saved choice wins, else French for a French browser, else English. Same key.
      (function () {
        var language = null;
        try {
          language = localStorage.getItem('interview-cards-language');
        } catch (error) {
          language = null;
        }
        if (language !== 'en' && language !== 'fr') {
          language = /^fr/i.test(navigator.language || '') ? 'fr' : 'en';
        }
        document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
